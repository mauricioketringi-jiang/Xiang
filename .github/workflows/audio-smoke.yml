name: Stage D regression smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate entrypoint, content and scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          html=Path('index.html').read_text(encoding='utf-8')
          data=Path('stage-c-data.js').read_text(encoding='utf-8')
          assert '<script src="./stage-c-data.js"></script>' in html or 'src="stage-c-data.js"' in html
          for token in ['startEarMode', 'stopEarMode', 'resumeEarMode', 'allLessons', 'startSession', 'earState']:
              assert token in html, token
          for token in ['STAGE_C_DATA','IELTS','TOEIC','BEC']:
              assert token in data, token
          for name in ('sw.js','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png'):
              assert Path(name).is_file(),name
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          blocks=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',html,re.I)
          content=[body for attrs,body in blocks if not re.search(r'\bsrc\s*=',attrs,re.I)]
          assert len(content)==1
          Path('/tmp/stage-d.js').write_text(content[0],encoding='utf-8')
          PY
          node --check /tmp/stage-d.js
          node --check stage-c-data.js
