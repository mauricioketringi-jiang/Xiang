name: VF Source Smoke Check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original training source
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          assert len(re.findall(r'\{id:\d+,title:',h))>=20
          assert len(re.findall(r'"id":"industrial-2[123]-\d{2}"',h))==116
          assert 'exam:' not in h
          assert 'pairedStart' in h
          assert 'function renderLearn(' in Path('learn-ui.js').read_text(encoding='utf-8')
          PY
          node --check learn-ui.js
          node --check learn-data.js
