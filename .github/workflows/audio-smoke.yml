name: Mobile audio browser smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build online English audio tokens
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 scripts/build_audio.py
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify streaming audio and answer flow
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox','--autoplay-policy=no-user-gesture-required'] });
            const page = await browser.newPage({ viewport: {width:390,height:844},isMobile:true,hasTouch:true });
            const errors = [];
            page.on('pageerror', err => { errors.push(err.message); console.log('PAGE ERROR:',err.message); });
            page.on('console', msg => { if(msg.type()==='error') console.log('CONSOLE ERROR:',msg.text()); });
            await page.goto('http://127.0.0.1:8765/', {waitUntil:'domcontentloaded'});
            await page.locator('[data-tab="lab"]').first().click();
            const options = await page.locator('#freeCount option').evaluateAll(nodes => nodes.map(x => x.value));
            if(JSON.stringify(options)!==JSON.stringify(['10','30','50'])) throw new Error('Incorrect training counts: '+JSON.stringify(options));
            await page.locator('#freeCount').selectOption('50');
            await page.locator('#freeStart').click();
            if(await page.locator('#questionCount').textContent()!=='1 / 50') throw new Error('50-question training was not generated');
            await page.locator('#backPractice').click();
            await page.locator('[data-tab="home"]').first().click();
            await page.locator('[data-lesson="num:1"]').first().click();
            if(await page.locator('#questionCount').textContent()!=='1 / 10') throw new Error('Standard lesson should contain 10 questions');
            if(await page.locator('[data-audio-action="enable-media"]').count())throw new Error('Heavy voice download prompt is still visible');
            await page.waitForFunction(
              () => {
                const s = document.getElementById('playStatus')?.textContent || '';
                if(/初始化失败|无法播放|下载失败/.test(s)) throw new Error(s);
                return s.includes('声音播放结束') || (document.getElementById('timerText')?.textContent || '').endsWith('s');
              },
              null,
              {timeout:240000}
            );
            const coverage=await page.evaluate(()=>{
              const wanted=new Set();
              const pattern=/[A-Za-z]+(?:'[A-Za-z]+)*/g;
              const collect=text=>{
                for(const word of (String(text).match(pattern)||[]))wanted.add(word.toLowerCase().replace(/[^a-z]/g,''));
              };
              for(let id=1;id<=16;id++){
                for(let k=0;k<100;k++)collect(generateNumber(id,'en-US').audioText);
                for(let k=0;k<40;k++)collect(generateNumber(id,'en-GB').audioText);
              }
              for(const w of examples)collect(w.audioText);
              return [...wanted].sort();
            });
            const manifest=await (await page.request.get('http://127.0.0.1:8765/audio/manifest.json')).json();
            const missing=coverage.filter(word=>!manifest.tokens.includes(word));
            if(missing.length)throw new Error('Missing online audio tokens: '+missing.join(', '));
            console.log('ONLINE AUDIO COVERAGE:',coverage.length,'tokens');
            const status = await page.locator('#playStatus').textContent();
            console.log('AUDIO PLAYBACK STATUS:',status);
            const key = await page.locator('[data-key]').filter({hasText:/^[0-9]$/}).first();
            await key.click();
            await page.locator('.feedback-card').waitFor({timeout:5000});
            if(errors.length)throw new Error('Browser JS errors: '+errors.join(' | '));
            console.log('PASS: Online token audio completed and automatic answer feedback rendered.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
