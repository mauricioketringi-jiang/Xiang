name: Offline system voice browser smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify offline usage and native voice answer flow
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await context.addInitScript(()=>{
              const voices=[
                {name:'Local English US',lang:'en-US',localService:true},
                {name:'Local English UK',lang:'en-GB',localService:true},
                {name:'Remote English',lang:'en-US',localService:false}
              ];
              let speechTimer=null;
              const synth={
                paused:false,
                getVoices:()=>voices,
                resume(){},
                cancel(){clearTimeout(speechTimer);},
                speak(utterance){
                  window.__nativeSpeechCalls=(window.__nativeSpeechCalls||[]);
                  window.__nativeSpeechCalls.push({text:utterance.text,voice:utterance.voice.name,local:utterance.voice.localService});
                  clearTimeout(speechTimer);
                  speechTimer=setTimeout(()=>{
                    utterance.onstart?.();
                    speechTimer=setTimeout(()=>utterance.onend?.(),120);
                  },20);
                }
              };
              Object.defineProperty(window,'speechSynthesis',{configurable:true,value:synth});
              Object.defineProperty(window,'SpeechSynthesisUtterance',{
                configurable:true,value:class {constructor(text){this.text=text;}}
              });
              window.fetch=(...args)=>{
                window.__unexpectedFetches=(window.__unexpectedFetches||[]);
                window.__unexpectedFetches.push(String(args[0]));
                throw new Error('App tried an unexpected network fetch');
              };
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            await page.locator('[data-tab="lab"]').first().click();
            const counts=await page.locator('#freeCount option').evaluateAll(items=>items.map(x=>x.value));
            if(JSON.stringify(counts)!==JSON.stringify(['10','30','50']))throw new Error('Wrong lesson counts: '+counts);
            await page.locator('[data-lesson]').first().count();
            await page.waitForFunction(()=>navigator.serviceWorker?.controller!==null,null,{timeout:20000});
            console.log('PASS: Offline app shell service worker activated');
            await context.setOffline(true);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('[data-lesson="num:1"]').first().click();
            if((await page.locator('#questionCount').textContent()).trim()!=='1 / 10')
              throw new Error('Standard lesson not 10 questions');
            await page.waitForFunction(
              ()=>(document.getElementById('playStatus')?.textContent||'').includes('朗读结束'),
              null,{timeout:10000}
            );
            const voiceUse=await page.evaluate(()=>({calls:window.__nativeSpeechCalls||[],fetches:window.__unexpectedFetches||[]}));
            if(!voiceUse.calls.length||!voiceUse.calls.every(x=>x.local))
              throw new Error('The app used a nonlocal voice');
            if(voiceUse.fetches.length)throw new Error('Voice still fetched online resources: '+voiceUse.fetches);
            if(await page.locator('audio').count())throw new Error('Audio asset player still exists');
            await page.locator('[data-key="0"]').click();
            await page.locator('.feedback-card').waitFor({timeout:5000});
            if(errors.length)throw new Error('Uncaught browser errors: '+errors.join(' | '));
            console.log('PASS: Offline reload, local voice selection, replay timing and automatic answer submission');
            await browser.close();
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
