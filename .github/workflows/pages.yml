name: Deploy advanced voice reflex PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['function generateNumber(', 'function startSession(', 'function submitAnswer(',
                    'totalAnswered', 'totalCorrect', 'flowMode', 'accentMode','noiseMode','reflectionMode']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing advanced training features: '+', '.join(missing))
          for name in ('sw.js','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png'):
              if not Path(name).is_file():raise SystemExit('Missing PWA file: '+name)
          blocks=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I)
          if len(blocks)!=1:raise SystemExit('Expected one complete inline JavaScript block')
          Path('/tmp/voice-reflex-check.js').write_text(blocks[0],encoding='utf-8')
          PY
          node --check /tmp/voice-reflex-check.js
          python3 -m json.tool manifest.webmanifest > /dev/null
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
