name: Deploy stage D voice reflex training PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate full stage D app
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          needed=['function generateNumber(', 'function startSession(', 'function submitAnswer(', 'startEarMode(', 'stopEarMode(', 'stage-c-data.js', 'industrial-23-40']
          missing=[x for x in needed if x not in html]
          if missing: raise SystemExit('Stage D feature missing: '+', '.join(missing))
          for name in ('stage-c-data.js','sw.js','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png'):
              if not Path(name).is_file(): raise SystemExit('Missing file: '+name)
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',html,re.I)
          inline=[body for attrs,body in scripts if not re.search(r'\bsrc\s*=',attrs,re.I)]
          if len(inline)!=1: raise SystemExit('Expected one complete inline JavaScript block')
          Path('/tmp/stage-d-check.js').write_text(inline[0],encoding='utf-8')
          PY
          node --check /tmp/stage-d-check.js
          node --check stage-c-data.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
