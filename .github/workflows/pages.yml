name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'async function synthesizePiper(',
              "document.createElement('audio')",
              'async function playPiperBlob(',
              "navigator.audioSession.type='playback'",
              'voice_reflex_piper_consent_',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing media-audio implementation markers: ' + ', '.join(missing))
          if 'data-action="submit"' in html:
              raise SystemExit('Legacy manual submit button must remain removed')
          speak = re.search(r'function speakCurrent\\(\\)\\s*\\{([\\s\\S]*?)\\n\\}', html)
          if not speak or 'playMediaText(' not in speak.group(1):
              raise SystemExit('Media TTS must remain the primary speakCurrent path')

          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/voice-reflex.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/voice-reflex.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
