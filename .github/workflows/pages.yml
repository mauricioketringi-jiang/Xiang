name: Deploy Voice Reflex · VF V3 Learning Revision
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved 23 lessons and V3 learning modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          index=Path('index.html').read_text(encoding='utf-8')
          cdata=Path('stage-c-data.js').read_text(encoding='utf-8')
          ldata=Path('learn-data.js').read_text(encoding='utf-8')
          lui=Path('learn-ui.js').read_text(encoding='utf-8')
          required=['function generateNumber(', 'function startSession(', 'function submitAnswer(',
                    'startEarMode(', 'stopEarMode(', 'industrial-23-40', 'pairedStart',
                    'stage-c-data.js?v=vf3','learn-data.js?v=vf3','learn-ui.js?v=vf3']
          for name in required: assert name in index, f'Missing feature: {name}'
          assert len(re.findall(r'\{id:\d+,title:',index)) >= 20
          assert len(re.findall(r'"id":"industrial-2[123]-\d{2}"',index)) == 116
          assert index.count('class="card lab-card"') == 3
          assert all(term not in index for term in ('exam:', '考试专项','data-exam','stagec-exams'))
          stage=json.loads(re.search(r'window.STAGE_C_DATA\s*=\s*(\{[\s\S]*\});\s*',cdata).group(1))
          assert 'exams' not in stage and len(stage['minimum'])==14 and len(stage['scenarios'])>=20
          learn=json.loads(re.search(r'window.LEARN_DATA\s*=\s*(\{[\s\S]*\});\s*',ldata).group(1))
          assert [len(learn[k]) for k in ('base','extra','pairs','large','terms','rules','industrial')]==[10,4,7,6,10,4,116]
          assert all(s in lui for s in ('function renderLearn(','lrIndustrialModules','lrShown'))
          for name in ('stage-c-data.js','learn-data.js','learn-ui.js','sw.js','manifest.webmanifest',
                       'icons/icon-192.png','icons/icon-512.png','独立单文件网页版.html'):
              assert Path(name).is_file(),name
          blocks=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',index,re.I)
          inline=[s for a,s in blocks if not re.search(r'\bsrc\s*=',a,re.I)]
          assert len(inline)==1
          Path('/tmp/app-inline.js').write_text(inline[0],encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          PY
          node --check /tmp/app-inline.js
          node --check stage-c-data.js
          node --check learn-data.js
          node --check learn-ui.js
          node --check sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
