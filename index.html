<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07C160">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="声音反射训练">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="application-name" content="声音反射训练">
  <title>英语数字与专业词汇 · 声音反射训练</title>
  <style>
    :root { --green:#07C160; --dark:#079c50; --bg:#F7F8FA; --white:#fff; --ink:#1D2733; --muted:#8A939E; --line:#EAEFF1; --red:#EA5252; --gold:#E9AA37; --soft:#EAF9F1; --shadow:0 6px 24px rgba(20,48,36,.045); --safe-bottom:env(safe-area-inset-bottom,0px); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; margin:0; min-height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#E8ECED; color:var(--ink); overscroll-behavior:none; }
    button,select { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; border:0; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .app { width:min(100%,480px); height:100vh; height:var(--app-height,100dvh); min-height:0; margin:0 auto; position:relative; overflow:hidden; background:var(--bg); box-shadow:0 0 40px rgba(0,0,0,.10); }
    .page { display:none; height:100%; min-height:0; min-width:0; overflow:hidden; flex-direction:column; }
    .page.active { display:flex; }
    .page-scroll { flex:1 1 auto; min-height:0; min-width:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); scrollbar-width:thin; overscroll-behavior:contain; }
    .page-title { font-size:24px; font-weight:800; letter-spacing:-.5px; margin:4px 0 5px; }
    .subtitle { color:var(--muted); font-size:12px; margin:0 0 18px; line-height:1.65; }
    .card { background:var(--white); border:1px solid #F0F2F3; border-radius:17px; box-shadow:var(--shadow); padding:16px; }
    .progress-card { background:linear-gradient(135deg,#09BE62,#0A9F56); border:none; color:white; overflow:hidden; position:relative; }
    .progress-card::after { content:""; width:150px; height:150px; position:absolute; right:-60px; top:-75px; border:25px solid rgba(255,255,255,.08); border-radius:50%; pointer-events:none; }
    .overline { font-size:12px; font-weight:600; opacity:.83; }
    .big-percent { font-size:39px; font-weight:800; line-height:1.4; font-variant-numeric:tabular-nums; }
    .progress-track { height:8px; border-radius:100px; background:rgba(255,255,255,.27); margin:8px 0 10px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:100px; background:#fff; transition:width .25s; }
    .progress-caption { font-size:12px; opacity:.95; }
    .section-title { font-size:14px; font-weight:750; margin:24px 2px 10px; display:flex; align-items:center; justify-content:space-between; }
    .section-title small { color:var(--muted); font-size:11px; font-weight:500; }
    .lesson-group { background:white; border-radius:16px; overflow:hidden; border:1px solid #F0F1F3; box-shadow:var(--shadow); }
    .lesson { background:white; width:100%; display:flex; text-align:left; gap:12px; align-items:center; padding:15px 12px; color:var(--ink); }
    .lesson + .lesson { border-top:1px solid #F1F3F5; }
    .lesson:active { background:#F7FCF9; }
    .lesson-index { width:39px; height:39px; flex:none; display:grid; place-items:center; border-radius:12px; background:#F3F5F7; color:#66717A; font-size:13px; font-weight:800; }
    .lesson.started .lesson-index { background:var(--soft); color:var(--dark); }
    .lesson.passed .lesson-index { background:#DFF8E9; color:var(--dark); }
    .lesson-main { min-width:0; flex:1; }
    .lesson-name { font-size:14px; font-weight:700; line-height:1.35; }
    .lesson-desc { font-size:11px; margin-top:4px; line-height:1.5; color:var(--muted); }
    .lesson-score { font-size:10.5px; color:#8D959D; margin-top:7px; font-variant-numeric:tabular-nums; }
    .status { font-size:10px; border-radius:100px; padding:5px 8px; flex:none; background:#F2F4F5; color:#8C959E; white-space:nowrap; }
    .status.going { background:#E7F9EF; color:#079D54; }
    .status.passed { color:#B9821B; background:#FFF6DE; letter-spacing:-1px; }
    .tabbar { background:#fff; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); padding:7px 8px calc(5px + var(--safe-bottom)); flex:none; }
    .tab { color:#939DA5; background:transparent; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:600; }
    .tab svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .tab.active { color:var(--dark); }
    .lab-title { font-size:14px; margin:0 0 10px; font-weight:750; }
    .lab-card { margin-bottom:14px; }
    .hint { font-size:12px; color:#75818C; line-height:1.7; margin:4px 0 12px; }
    .row { display:flex; align-items:center; gap:9px; }
    .between { justify-content:space-between; }
    .pill { background:var(--soft); color:var(--dark); border-radius:20px; padding:4px 8px; font-weight:700; font-size:11px; }
    .btn { min-height:43px; padding:10px 13px; border-radius:11px; font-weight:700; background:#F3F5F6; color:#51606B; font-size:13px; }
    .btn.primary { background:var(--green); color:#fff; }
    .btn.ghost { background:#EAF9F0; color:#078F4A; }
    .btn.outline { background:#fff; border:1px solid var(--line); }
    .btn.danger { background:#FFF0F0; color:#D84B4B; }
    .btn.full { width:100%; }
    .form-label { display:block; color:#56616D; font-size:12px; font-weight:650; margin:11px 0 6px; }
    .select { width:100%; min-height:43px; padding:8px 12px; border:1px solid #E3E9EA; border-radius:10px; background:#FAFBFB; color:var(--ink); outline-color:var(--green); }
    .input-row { display:grid; grid-template-columns:1fr 110px; gap:9px; }
    .weak-list { max-height:220px; overflow-y:auto; }
    .weak-row { display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line); padding:10px 0; font-size:12px; }
    .weak-row strong { display:block; font-size:13px; line-height:1.6; }
    .weak-row small { color:var(--muted); line-height:1.4; }
    .micro { color:var(--muted); font-size:11px; }
    .import-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .import-actions .btn { min-height:45px; }
    .notice { background:#F5F8F6; border-radius:10px; color:#76867C; padding:10px; font-size:11px; line-height:1.7; margin-top:12px; }
    .practice-top { flex:none; background:#fff; border-bottom:1px solid var(--line); padding:calc(9px + env(safe-area-inset-top,0px)) 13px 9px; }
    .practice-topline { display:flex; justify-content:space-between; align-items:center; gap:7px; }
    .back { color:var(--ink); background:transparent; font-size:24px; padding:0 7px 0 0; line-height:35px; }
    .practice-title { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
    .settings-row { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-top:8px; }
    .settings-row .select { width:auto; min-height:33px; padding:4px 8px; font-size:12px; background:#F5F7F7; border:0; flex:1; }
    .question-count { font-size:11px; font-weight:700; color:#78838B; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .tiny-track { background:#E8F1EB; height:4px; border-radius:9px; overflow:hidden; margin-top:9px; }
    .tiny-fill { background:var(--green); width:0; height:100%; transition:width .2s; }
    .practice-body { min-height:0; min-width:0; flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:12px 15px 10px; display:flex; flex-direction:column; scrollbar-width:none; overscroll-behavior:contain; }
    .practice-body::-webkit-scrollbar { display:none; }
    .listen-card { flex:1; min-height:160px; background:#fff; border-radius:18px; border:1px solid #EDF2EF; padding:14px; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; }
    .listen-chip { color:#87918D; font-size:12px; font-weight:650; }
    .sound-wave { height:59px; display:flex; gap:5px; justify-content:center; align-items:center; margin:6px 0 9px; }
    .sound-wave i { display:block; width:5px; border-radius:8px; background:var(--green); height:14px; animation:wave .82s infinite ease-in-out alternate; }
    .sound-wave i:nth-child(2),.sound-wave i:nth-child(6) { animation-delay:-.4s; height:27px; }
    .sound-wave i:nth-child(3),.sound-wave i:nth-child(5) { animation-delay:-.2s; height:39px; }
    .sound-wave i:nth-child(4) { animation-delay:-.55s; height:51px; }
    .sound-wave.paused i { animation-play-state:paused; opacity:.43; height:10px; }
    @keyframes wave { from { transform:scaleY(.35); } to { transform:scaleY(1.12); } }
    .timer { font-size:34px; letter-spacing:-1px; font-weight:850; color:#253A31; font-variant-numeric:tabular-nums; }
    .timer-hint { color:var(--muted); font-size:11px; margin-top:4px; }
    .answer-display { flex:none; margin-top:10px; border:2px solid #DDEFE4; border-radius:13px; background:#fff; min-height:55px; padding:12px 13px; text-align:center; font-weight:750; font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:1px; overflow-wrap:anywhere; }
    .answer-display.placeholder { font-weight:500; letter-spacing:0; font-size:13px; color:#A7B1B2; }
    .keypad-shell { flex:0 0 auto; min-width:0; border-top:1px solid #E7EBE9; background:#F9FAFA; padding:9px 11px calc(9px + env(safe-area-inset-bottom,0px)); position:relative; z-index:2; }
    .keypad-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
    .key { height:44px; height:clamp(40px,6vh,53px); height:clamp(40px,6dvh,53px); min-height:40px; background:white; color:#27352F; border:1px solid #E8ECE9; border-radius:10px; font-size:21px; font-weight:740; box-shadow:0 2px 0 #DFE6E1; }
    .key:active { background:#E3F7EB; transform:translateY(1px); box-shadow:none; }
    .key.alt { font-size:13px; background:#ECF0EF; }
    .key.green { color:#fff; background:var(--green); box-shadow:0 2px 0 var(--dark); border-color:var(--green); font-size:14px; }
    .key.letters { font-size:16px; height:44px; height:clamp(40px,6vh,50px); height:clamp(40px,6dvh,50px); }
    .keypad-grid.letter-grid { grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
    .letter-actions { display:grid; grid-template-columns:1fr 1fr 1fr 1.35fr; gap:6px; margin-top:7px; }
    .letter-actions .key { font-size:13px; }
    .choice-stack { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .choice { min-height:73px; text-align:left; line-height:1.55; padding:12px; font-size:14px; border-radius:12px; background:#fff; border:2px solid #E7EBE9; color:var(--ink); font-weight:650; }
    .choice.selected { border-color:var(--green); background:#EEFBF3; }
    .choice:disabled { opacity:.95; }
    .choice.selected:active { opacity:.85; }
    .self-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px; }
    .self-row .btn { min-height:48px; font-size:13px; }
    .feedback-card { width:100%; text-align:left; }
    .feedback-verdict { font-size:21px; font-weight:850; margin-bottom:10px; }
    .feedback-verdict.good { color:var(--dark); }
    .feedback-verdict.bad { color:var(--red); }
    .feedback-sub { font-size:12px; color:#6E7982; margin-bottom:14px; }
    .feedback-line { padding:9px 0; border-top:1px solid #EDF0F0; line-height:1.6; font-size:12px; overflow-wrap:anywhere; }
    .feedback-line .k { color:var(--muted); display:block; margin-bottom:3px; font-size:11px; }
    .feedback-line .v { font-size:15px; color:#26342D; font-weight:700; }
    .feedback-line .ipa { font-size:12px; font-weight:500; color:#68766E; }
    .wrong-char { color:#E14B4B; background:#FFF0EF; border-radius:3px; padding:1px; }
    .right-char { color:#208950; }
    .review-controls { display:grid; grid-template-columns:1fr 1.5fr; gap:10px; }
    .review-controls .btn { min-height:50px; }
    .summary-mask { position:absolute; z-index:10; inset:0; display:none; background:rgba(23,40,34,.52); padding:20px; justify-content:center; align-items:center; backdrop-filter:blur(3px); }
    .summary-mask.visible { display:flex; }
    .summary-panel { width:100%; max-width:380px; background:white; padding:25px 21px 19px; border-radius:23px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.16); }
    .summary-stars { color:var(--gold); font-size:37px; letter-spacing:4px; margin:5px 0 8px; }
    .summary-title { font-size:22px; font-weight:800; }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:17px 2px; }
    .summary-grid strong { display:block; font-size:23px; font-variant-numeric:tabular-nums; }
    .summary-grid span { font-size:11px; color:#86928C; }
    .summary-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .toast { display:none; position:absolute; left:10%; right:10%; bottom:calc(85px + var(--safe-bottom)); background:rgba(33,45,40,.94); padding:12px; border-radius:11px; font-size:12px; color:white; text-align:center; z-index:20; line-height:1.6; }
    .toast.visible { display:block; }
    .hidden { display:none!important; }
    .play-audio-btn { min-height:42px; margin-top:8px; padding:9px 18px; border-radius:999px; background:#E8F8EF; color:#078F4A; font-size:13px; font-weight:750; border:1px solid #D5F0E0; touch-action:manipulation; }
    .play-audio-btn:active { background:#D8F2E3; transform:scale(.98); }
    .ready-kicker { font-size:12px; font-weight:650; color:#7B8F84; line-height:1.6; }
    .ready-mode { font-size:17px; font-weight:850; color:#14613C; margin:17px 0 20px; line-height:1.5; text-align:center; }
    .ready-start { width:min(200px,100%); height:52px; min-height:52px; border-radius:999px; border:0; background:linear-gradient(135deg,#0BC968,#079D50); color:white; font-size:18px; font-weight:850; box-shadow:0 9px 22px rgba(7,193,96,.24),inset 0 1px rgba(255,255,255,.2); letter-spacing:.2px; cursor:pointer; touch-action:manipulation; transition:transform .12s,box-shadow .12s; }
    .ready-start:active { transform:scale(.965);box-shadow:0 4px 11px rgba(7,193,96,.2); }
    .ready-start:focus-visible { outline:3px solid #89DBB0;outline-offset:3px; }
    .keypad-shell.ready-locked { opacity:.45; pointer-events:none; user-select:none; }
    .ready-mic-preview { min-height:50px; display:grid;place-items:center;background:#F0F7F3;border-radius:12px;font-size:13px;color:#668273; }
    .ready-card { gap:1px; }

    #storageStatus { line-height:1.6; }
    @media(max-width:480px) {
      html,body { background:var(--bg); }
      .app { width:100%; max-width:none; box-shadow:none; }
      .page-scroll { padding-left:14px; padding-right:14px; }
      .practice-body { padding-left:12px; padding-right:12px; }
      .settings-row { gap:6px; }
      .settings-row .select { min-width:0; font-size:16px; }
      .select { font-size:16px; }
      .tabbar { padding-left:6px; padding-right:6px; }
    }
    @media(max-height:740px) { .practice-body { padding-top:8px; padding-bottom:7px; } .listen-card { min-height:104px; padding:9px; } .sound-wave { height:38px; margin:2px 0 5px; } .timer { font-size:28px; } .answer-display { min-height:43px; padding:8px; margin-top:6px; } .keypad-shell { padding-top:6px; } .key { height:40px; } .key.letters { height:39px; } .choice { min-height:58px; } .play-audio-btn { min-height:38px; margin-top:5px; padding:7px 15px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

    .training-controls,.advanced-modes {display:flex;align-items:center;gap:6px;margin-top:7px;min-width:0;}
    .training-controls>* ,.advanced-modes>* {flex:1;min-width:0;}
    .training-controls .compact,.advanced-modes .compact {min-height:34px;font-size:11px;padding:5px 7px;}
    .advanced-modes[hidden]{display:none;}
    .flow-toggle{display:flex;align-items:center;justify-content:center;background:#EAF9F1;color:#087F48;border-radius:9px;min-height:34px;font-size:11px;font-weight:800;white-space:nowrap;}
    .flow-toggle input{accent-color:var(--green);width:15px;height:15px;margin-right:5px;}
    .accent-display{font-size:12px;color:var(--dark);font-weight:800;display:grid;place-items:center;flex:1;}
    .key.disabled-key{opacity:.2;pointer-events:none;filter:grayscale(.9);}
    .key.relevant-key{box-shadow:inset 0 0 0 2px var(--green);background:#E7F9EE!important;color:#04763D!important;font-weight:900;}
    .fast-feedback{font-size:29px;font-weight:900;color:#078E4B;background:#E6F9EE;border-radius:16px;padding:24px;text-align:center;animation:fast-glow .45s ease-out;}
    @keyframes fast-glow{0%{transform:scale(.92);background:#B8F5D4;}60%{transform:scale(1.02);}100%{transform:scale(1);background:#E6F9EE;}}
    .speaking-target{font-size:clamp(42px,11vw,66px);font-weight:900;letter-spacing:-2px;color:#153D2A;word-break:break-word;line-height:1.2;}
    .speaking-help{font-size:12px;color:#718179;line-height:1.5;margin:14px 0;}
    .speaking-result{font-size:15px;color:var(--dark);min-height:30px;word-break:break-word;}
    .speaking-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
    .speaking-actions .btn{min-height:39px;padding:9px 12px;}
    .practice-top{padding-bottom:7px;}
    .keypad-extras{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
    .letter-actions{grid-template-columns:repeat(3,minmax(0,1fr));}

    .settings-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center;}
    .settings-row .select,.settings-row .accent-display,.settings-row .question-count{box-sizing:border-box;min-width:0;width:100%;height:37px;min-height:37px;border-radius:10px;background:#F2F7F4;display:flex;justify-content:center;align-items:center;text-align:center;padding:4px 6px;font-size:12px;border:1px solid #E4EDE7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .settings-row .select{display:block;text-align:center;text-align-last:center;appearance:auto;-webkit-appearance:menulist;color:#27352F;}
    .settings-row .accent-display{font-size:10px;line-height:1.15;white-space:normal;overflow-wrap:anywhere;}
    .settings-row #questionCount{font-size:12px;font-weight:750;color:#27352F;font-variant-numeric:tabular-nums;cursor:pointer;}
    .training-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center;}
    .mode-pill{min-width:0;min-height:37px;height:37px;display:flex;justify-content:center;align-items:center;gap:3px;padding:0 2px;border:1px solid #E3E9E7;background:#F6F8F7;border-radius:10px;color:#6A7771;font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap;letter-spacing:-.45px;}
    .mode-pill.active{background:#E5F9EE;border:1.5px solid #07C160;color:#078949;}
    .mode-pill input{flex:none;width:12px;height:12px;accent-color:#07C160;margin:0;}
    .training-controls input[type=hidden]{display:none;}
    .keypad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
    .keypad-shell{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));}
    .key{height:clamp(43px,6.1dvh,54px);min-height:43px;font-size:24px;border-radius:11px;}
    .key.alt{font-size:15px;font-weight:800;background:#EEF2F1;}
    .code-entry{width:100%;height:36px;border:0;outline:0;background:transparent;text-align:center;font:700 16px -apple-system,BlinkMacSystemFont,sans-serif;text-transform:uppercase;color:#26392F;}
    .code-entry::placeholder{font-size:12px;opacity:.7;}
    .keypad-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
    .keypad-grid .key{height:clamp(44px,6.5dvh,57px);min-height:44px;min-width:0;}
    .spell-board{display:flex;flex-direction:column;gap:6px;}
    .spell-row{display:grid;gap:3px;grid-template-columns:repeat(10,minmax(0,1fr));}
    .spell-row.row9{grid-template-columns:repeat(9,minmax(0,1fr));margin-inline:3.4%;}
    .spell-row.row7{grid-template-columns:repeat(7,minmax(0,1fr));margin-inline:10%;}
    .spell-row .key{height:clamp(39px,5.5dvh,49px);min-height:39px;border-radius:7px;font-size:clamp(14px,3.8vw,20px);font-weight:750;padding:0;box-shadow:0 2px 0 #DFE6E1;}
    .spell-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:1px;}
    .spell-actions .key{height:clamp(44px,6dvh,54px);min-height:44px;font-size:13px;}
    .answer-display.has-inline-separator{display:flex;justify-content:stretch;align-items:center;gap:8px;}
    .answer-display .answer-value{flex:1;min-width:0;text-align:center;overflow-wrap:anywhere;}
    .inline-separator{flex:none;min-width:75px;border-radius:9px;border:1.5px solid #07C160;background:#E8F8EF;color:#078949;font-weight:850;font-size:13px;padding:8px 6px;}
    .answer-display.spell-entry{font-size:19px;letter-spacing:.1px;line-height:1.3;min-height:50px;}
    .spell-hint{font-size:14px;color:#247047;background:#EBFAF2;border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:750;max-width:100%;overflow-wrap:anywhere;}
    .keypad-shell button{touch-action:manipulation;-webkit-touch-callout:none;user-select:none;}
    @media(max-width:360px){.mode-pill{font-size:11.5px;letter-spacing:-.8px;gap:2px;}.mode-pill input{width:11px;height:11px;}.spell-row{gap:2px;}.spell-actions{gap:4px;}}
    @media(max-height:700px){.keypad-grid .key{height:42px;min-height:42px;}.spell-row .key{height:35px;min-height:35px;}.spell-actions .key{height:39px;min-height:39px;}.answer-display.spell-entry{min-height:43px;}}

    @media(max-height:700px){.key{height:40px;min-height:40px;}.listen-card{min-height:88px;}.practice-body{padding-top:6px;}.answer-display{min-height:40px;}}

    /* V7 QWERTY: nearly edge-to-edge and thumb-sized without system keyboard. */
    .keypad-shell.spelling-layout {
      width:100%;min-width:0;margin:0;padding:6px 4px calc(7px + var(--safe-bottom));
      box-sizing:border-box;overflow:hidden;
    }
    .keypad-shell.spelling-layout .spell-board {width:100%;gap:6px;}
    .keypad-shell.spelling-layout .spell-row {display:grid;gap:4px;grid-template-columns:repeat(10,minmax(0,1fr));margin:0;}
    .keypad-shell.spelling-layout .spell-row.row9 {
      grid-template-columns:repeat(9,minmax(0,1fr));padding-inline:4.5%;margin:0;
    }
    .keypad-shell.spelling-layout .spell-row.spell-third {
      grid-template-columns:1.4fr repeat(7,minmax(0,1fr)) 1.55fr;padding-inline:0;
    }
    .keypad-shell.spelling-layout .spell-row .key {
      width:100%;min-width:0;height:clamp(48px,5.9dvh,52px);min-height:48px;
      padding:0;border-radius:8px;font-size:18px;font-weight:600;
      box-shadow:0 2px 0 #D7DFDB;background:#fff;
    }
    .keypad-shell.spelling-layout .spell-row .key.spell-special {
      font-size:21px;background:#E5EBE9;font-weight:700;
    }
    .keypad-shell.spelling-layout .spell-actions {
      display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:4px;margin:0;
    }
    .keypad-shell.spelling-layout .spell-actions .key {
      width:100%;height:52px;min-height:48px;border-radius:8px;font-size:14px;font-weight:700;
    }
    .keypad-shell.spelling-layout .spell-actions .spell-confirm {
      background:#07C160;color:white;border-color:#07C160;font-size:17px;
    }
    .keypad-shell.spelling-layout .spell-row .key:active,
    .keypad-shell.spelling-layout .spell-actions .key:active {
      transform:scale(.94);background:#D8F3E4;box-shadow:none;
    }
    .keypad-shell.spelling-layout .spell-actions .spell-confirm:active{background:#078846;color:white;}
    @media(max-width:340px){
      .keypad-shell.spelling-layout .spell-row {gap:3px;}
      .keypad-shell.spelling-layout .spell-row .key {font-size:17px;}
      .keypad-shell.spelling-layout .spell-actions .key {font-size:13px;}
    }
    @media(max-height:600px){
      .keypad-shell.spelling-layout .spell-row .key {height:45px;min-height:45px;}
      .keypad-shell.spelling-layout .spell-actions .key {height:46px;min-height:46px;}
    }


    /* Stage A: ready layout, transcription and visual/haptic feedback. */
    .keypad-shell.ready-collapsed{display:none!important;}
    .ready-audio-note{max-width:310px;margin-top:15px;font-size:11px;line-height:1.65;color:#7C8C83;text-align:center;}
    .timer-label{font-size:12px;font-weight:750;color:#668478;margin:1px 0 1px;}
    .reaction-benchmark{margin:4px 0 11px;padding:10px 8px;border-radius:10px;background:#F1F8F3;color:#2C6D47;font-size:11px;line-height:1.6;text-align:center;}
    .speech-bottom-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
    .speech-bottom-actions .btn{min-width:0;min-height:55px;padding:8px 3px;border-radius:13px;font-size:clamp(11px,3.1vw,14px);white-space:nowrap;}
    .speaking-help{font-size:12px;color:#7A8B83;line-height:1.5;margin:9px 0;}
    .speaking-result{display:flex;align-items:center;justify-content:center;max-width:100%;min-height:42px;padding:9px 13px;border:1px solid #D8EAE0;background:#F2F8F4;border-radius:999px;color:#216A44;font-size:clamp(12px,3.8vw,16px);font-weight:750;line-height:1.4;word-break:break-word;}
    .speaking-result.matched{background:#D8F7E5;box-shadow:0 0 0 4px rgba(7,193,96,.12);color:#067C40;}
    .speech-demo{margin:10px 0 3px;}
    .answer-display.spell-entry{font-size:24px;font-weight:850;color:#176B42;text-align:center;min-height:57px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:1px;}
    .spelled-value{min-width:0;overflow-wrap:anywhere;color:#1A5F3F;}
    .spelled-caret{height:26px;width:2px;display:inline-block;background:#07C160;animation:caret-blink .85s step-end infinite;vertical-align:middle;}
    @keyframes caret-blink{50%{opacity:0;}}
    .feedback-flash-correct{animation:stageA-correct .5s ease-out;}
    .feedback-flash-wrong{animation:stageA-wrong .5s ease-out;}
    @keyframes stageA-correct{0%,60%{box-shadow:inset 0 0 0 4px rgba(7,193,96,.45);background:#E0F9EA;}100%{box-shadow:none;background:#fff;}}
    @keyframes stageA-wrong{0%,55%{box-shadow:inset 0 0 0 4px rgba(223,65,65,.43);background:#FFF0EF;}100%{box-shadow:none;background:#fff;}}
    .wrong-fast{font-size:24px;font-weight:850;color:#CE4242;}
    .wrong-correct-answer{font-size:clamp(22px,7vw,32px);font-weight:900;margin:18px 0 9px;color:#AD3232;overflow-wrap:anywhere;}
    .wrong-reading{font-size:15px;font-weight:700;color:#3C4742;line-height:1.5;overflow-wrap:anywhere;}
    .wrong-next-note{margin-top:14px;color:#758279;font-size:12px;line-height:1.45;}
    @media(max-height:680px){.speaking-target{font-size:clamp(36px,10vw,56px);}.speech-bottom-actions .btn{min-height:47px;}.ready-audio-note{margin-top:7px;}}

    /* Stage B: statistics, grading, backups and review. */
    .summary-mask{padding:12px;align-items:center;}
    .summary-panel{max-height:calc(100dvh - 36px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:21px 17px 17px;}
    .stageb-stars{font-size:17px;color:#B9821B;white-space:nowrap;letter-spacing:0;}
    .pass-gap{font-size:11px;color:#7A5F42;background:#FFF7E9;padding:9px 10px;border-radius:10px;line-height:1.6;text-align:left;margin:8px 0;}
    .pass-gap.passed{background:#F1F9F4;color:#267446;}
    .chart-box{margin-top:12px;padding:10px;border:1px solid #ECF2EF;border-radius:12px;background:#FCFEFD;}
    .chart-label{font-size:12px;font-weight:750;color:#34443C;margin-bottom:4px;}
    .trend-chart{display:block;width:100%;height:auto;min-height:115px;}
    .trend-chart text{font-size:9px;fill:#839087;}
    .chart-legend{font-size:10px;color:#78867E;line-height:1.5;}
    .dash-metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px;}
    .dash-metric{padding:13px 9px;background:#F4F9F6;border-radius:11px;text-align:center;}
    .dash-metric strong{display:block;font-size:24px;color:#078D49;}
    .dash-metric span{font-size:11px;color:#68796F;}
    .confusion-row{padding:9px 0;border-top:1px solid #EDF0EE;}
    .confusion-head{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:12px;font-weight:700;}
    .confusion-count{font-size:11px;color:#9B6042;white-space:nowrap;}
    .confusion-track{height:7px;border-radius:99px;background:#F3EEE9;overflow:hidden;margin-top:6px;}
    .confusion-fill{height:100%;background:linear-gradient(90deg,#E8B67D,#D96A57);border-radius:99px;}
    .review-title{font-size:13px;font-weight:800;text-align:left;margin:12px 0 7px;}
    .review-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 0;border-top:1px solid #EDF1ED;text-align:left;align-items:center;}
    .review-detail{min-width:0;overflow-wrap:anywhere;}
    .review-detail strong{font-size:12px;color:#24372C;}
    .review-detail small{display:block;font-size:11px;color:#89918D;line-height:1.55;margin-top:3px;}
    .review-item .btn{padding:7px 8px;min-height:34px;font-size:11px;}
    .backup-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    .setting-help{font-size:11px;color:#7A8881;line-height:1.6;margin:7px 0 0;}
    .switch-row{display:flex;align-items:center;gap:9px;font-size:13px;margin:12px 0;}
    .switch-row input{width:19px;height:19px;accent-color:#07C160;}
    .summary-actions{position:sticky;bottom:-17px;padding:11px 0 calc(3px + env(safe-area-inset-bottom,0px));background:white;}
    @media(max-height:650px){.summary-panel{max-height:calc(100dvh - 16px);}}
    /* Stage C: new course groups, exam entry and explicit answer confirmation. */
    .stagec-tip{padding:9px 10px;margin-top:8px;border-radius:9px;background:#EFFAF3;color:#247748;font-size:12px;line-height:1.6;text-align:left;}
    .stagec-tip.error{background:#FFF1E9;color:#9D512A;}
    .stagec-confirm-row{display:flex;gap:8px;margin-top:6px;padding-bottom:env(safe-area-inset-bottom,0px);}
    .stagec-confirm-row .btn{min-height:42px;width:100%;}
    .stagec-entry{width:100%;border:0;background:transparent;font-size:23px;font-weight:800;color:#244334;text-align:center;outline:none;min-width:0;}
    .stagec-entry::placeholder{color:#A1ABA4;font-size:13px;font-weight:500;}
    .stagec-answer-help{font-size:11px;color:#6C8072;margin-top:7px;line-height:1.4;}
    @media(max-width:360px){.stagec-exams{gap:5px;}.stagec-exams .btn{font-size:11px;}}



    /* Stage D: auto listen-only mode, safe-area aware single-thumb stop control. */
    .ready-ear{display:block;width:min(286px,100%);margin:12px auto 0;min-height:44px;
      padding:10px 12px;border:1px solid #CFE8DB;border-radius:999px;background:#EDF9F2;
      color:#147946;font-weight:790;font-size:13px;line-height:1.35;box-shadow:none;}
    .ready-ear:active{background:#DDF4E7;transform:scale(.985);}
    .ear-playing .practice-top .settings-row,.ear-playing .practice-top .training-controls,.ear-playing .tiny-track{display:none!important;}
    .ear-playing .practice-body{padding:12px 13px;}
    .ear-playing #listenCard{gap:0;padding:20px 15px;min-height:0;}
    .ear-label{font-size:12px;color:#138450;font-weight:800;line-height:1.6;}
    .ear-count{font-size:12px;color:#81938A;margin-top:9px;}
    .ear-visual{font-size:clamp(66px,18vw,105px);line-height:1.25;margin:12px 0 7px;}
    .ear-phase{font-size:17px;font-weight:800;color:#26483A;line-height:1.6;}
    .ear-hint{font-size:12px;color:#85958B;line-height:1.7;margin-top:8px;max-width:320px;}
    .ear-reveal{margin-top:15px;width:100%;background:#F0FBF5;border:1px solid #D7F1E2;border-radius:16px;
      padding:15px 10px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere;}
    .ear-answer{font-size:clamp(33px,9vw,52px);font-weight:900;color:#087E43;line-height:1.3;letter-spacing:-.8px;}
    .ear-english{font-size:15px;color:#254436;line-height:1.5;font-weight:750;}
    .ear-meaning{font-size:13px;color:#667D70;line-height:1.6;}
    .ear-playing .keypad-shell{display:block!important;flex:none;width:100%;padding:9px 13px calc(11px + var(--safe-bottom));
      background:#fff;border-top:1px solid #E8F1EB;}
    .ear-stop{display:block;width:100%;height:56px;min-height:56px;border:1px solid #F5CACA;
      background:#FFF0F0;color:#B83535;border-radius:999px;font-size:17px;font-weight:850;}
    .ear-resume{padding:12px 18px;border-radius:999px;background:#E4F8ED;color:#087B46;
      font-size:15px;font-weight:850;margin-top:14px;border:1px solid #CBECD9;}
    @media(max-height:650px){.ear-playing #listenCard{padding:8px 12px;}.ear-visual{font-size:58px;margin:4px 0;}
      .ear-reveal{padding:9px;gap:4px;margin-top:7px;}.ear-answer{font-size:32px;}.ear-hint{margin-top:4px;}}
    .tab-emoji{font-size:19px;line-height:21px;display:block;}
    .tabbar .tab{font-size:10px;min-width:0;padding:2px 0;}

    /* 基础学习 V2：宽度优先，触摸目标 44px+，图表纯 CSS */
    #learnScroll{scroll-behavior:smooth;scroll-padding-top:12px}
    #learnBody{padding-bottom:12px}
    .lr-head{background:linear-gradient(145deg,#E9FAF0,#F9FFFB);border:1px solid #CDEEDC;border-radius:16px;margin:12px 0;padding:16px 14px}
    .lr-kicker{color:#087944;font-size:11px;font-weight:850;letter-spacing:.3px}
    .lr-head h2{margin:5px 0 8px;font-size:19px}
    .lr-head p{font-size:12px;color:#587566;line-height:1.7;margin:0}
    .lr-speed{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
    .lr-speed>span{font-size:11px;color:#4D6F5E;margin-right:auto;font-weight:800}
    .lr-speed button{border:1px solid #B6DFC7;border-radius:999px;padding:8px 9px;min-height:39px;background:white;color:#23714A;font-size:11px;font-weight:850}
    .lr-speed button.active{background:#07C160;color:white;border-color:#07C160}
    .lr-jump{display:flex;gap:7px;overflow-x:auto;margin:10px 0 14px;scrollbar-width:none}
    .lr-jump button{flex:none;min-height:40px;border-radius:999px;border:1px solid #D8EAE0;background:#fff;padding:8px 11px;font-size:11px;font-weight:780;color:#168353}
    .lr-block-title{font-size:14px;font-weight:900;margin:18px 2px 10px;line-height:1.6}
    .lr-block-title small{font-size:10px;color:#869C8E;font-weight:650}
    .lr-section{padding:14px 12px!important;margin:0 0 12px}
    .lr-section h2{margin:0;font-size:15px;line-height:1.55}
    .lr-desc{font-size:11px;color:#778F80;line-height:1.7;margin:6px 0 13px}
    .lr-list{display:grid;gap:7px}
    .lr-card{border:1px solid #E2EDE6;background:#FCFEFD;border-radius:12px;min-height:76px;padding:10px 9px;display:grid;grid-template-columns:minmax(38px,58px) minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left}
    .lr-card:active,.lr-twin-side:active,.lr-chip:active{background:#DFF7E8}
    .lr-num{font-size:18px;text-align:center;font-variant-numeric:tabular-nums;color:#0C9855;overflow-wrap:anywhere}
    .lr-word{display:flex;flex-direction:column;gap:3px;min-width:0}
    .lr-word>strong{font-size:14px;color:#1B3440;overflow-wrap:anywhere;line-height:1.3}
    .lr-ipa{font-size:11px;color:#52786D;overflow-wrap:anywhere}
    .lr-hint,.lr-example{font-size:10px;line-height:1.4;color:#8A968C;overflow-wrap:anywhere}
    .lr-play{white-space:nowrap;color:#07834D;font-size:10px;font-weight:850;border:1px solid #CBEAD9;background:#F0FBF4;border-radius:999px;padding:8px 5px}
    .lr-tip{padding:11px;border-left:3px solid #08B55D;background:#E9F8F0;border-radius:8px;font-size:11px;line-height:1.8;margin:12px 0}
    .lr-pairs{display:grid;gap:9px}
    .lr-twin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .lr-twin-side{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid #D3E9DD;border-radius:12px;padding:12px 9px;min-height:113px;min-width:0;background:#ECF9F1}
    .lr-twin-side.lr-ty{background:#F5F8FB;border-color:#DCE5F0}
    .lr-mini-tag{font-size:10px;color:#168B51;font-weight:800}
    .lr-ty .lr-mini-tag{color:#446F9D}
    .lr-twin-side>strong{font-size:13px;line-height:1.4;overflow-wrap:anywhere;color:#253E35}
    .lr-twin-side>small{font-size:11px;color:#58796C;overflow-wrap:anywhere}
    .lr-twin-side .lr-play{margin-top:auto}
    .lr-rule-tag{display:inline-block;color:#0A8749;font-size:10px;font-weight:800;background:#E7F9EE;border-radius:999px;padding:5px 9px}
    .lr-rule-content{font-size:12px;color:#415C4F;line-height:1.85}
    .lr-rule-content p{padding:8px 9px;background:#F7FAF8;border-left:2px solid #B6E6C8;border-radius:7px;margin:8px 0}
    .lr-rule-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .lr-chip{border-radius:11px;background:#ECF8F1;border:1px solid #D2ECD9;text-align:left;padding:10px;min-height:58px;color:#19754A;display:flex;flex-direction:column;gap:5px;min-width:0}
    .lr-chip span{font-size:11px;font-weight:850;overflow-wrap:anywhere}
    .lr-chip small{font-size:10px;color:#718A7C}
    .lr-finish .btn{margin-top:10px}
    @media(max-width:375px){.lr-card{grid-template-columns:40px minmax(0,1fr) auto;gap:5px;padding:8px 7px}.lr-num{font-size:16px}.lr-word>strong{font-size:13px}.lr-play{font-size:9px}.lr-twin-side>strong{font-size:12px}}

    .lr-row{display:flex;flex-direction:column;gap:0}
    .lr-row:has(.lr-example-btn) .lr-card{border-bottom-left-radius:5px;border-bottom-right-radius:5px}
    .lr-example-btn{display:block;width:100%;text-align:left;min-height:36px;padding:8px 12px;border:1px solid #DBEEE2;border-top:0;background:#F4FCF7;color:#13834B;font-size:11px;font-weight:760;border-radius:0 0 11px 11px;overflow-wrap:anywhere}
  </style>
</head>
<body>
<div class="app" id="app">
  <section class="page active" id="learnPage">
    <div class="page-scroll" id="learnScroll">
      <h1 class="page-title">基础学习</h1>
      <p class="subtitle">数字读音对照 · 0.7x 慢速 / 1.0x 常速点读</p>
      <div id="learnBody"></div>
    </div>
    <nav class="tabbar" aria-label="底部导航">
      <button class="tab active" data-tab="learn"><span class="tab-emoji">📖</span>基础学习</button>
      <button class="tab" data-tab="home"><span class="tab-emoji">🎯</span>课程闯关</button>
      <button class="tab" data-tab="lab"><span class="tab-emoji">⚡</span>特训与错题台</button>
    </nav>
  </section>

  <section class="page" id="homePage">
    <div class="page-scroll" id="homeScroll">
      <h1 class="page-title">声音反射训练</h1>
      <p class="subtitle">数字听写 × 专业词汇 · 听完即答，训练英语声音反射</p>
      <div class="card progress-card" id="progressCard"></div>
      <div id="resumeArea"></div>
      <div id="lessonList"></div>
    </div>
    <nav class="tabbar" aria-label="底部导航">
      <button class="tab" data-tab="learn"><span class="tab-emoji">📖</span>基础学习</button>
      <button class="tab active" data-tab="home"><span class="tab-emoji">🎯</span>课程闯关</button>
      <button class="tab" data-tab="lab"><span class="tab-emoji">⚡</span>特训与错题台</button>
    </nav>
  </section>

  <section class="page" id="labPage">
    <div class="page-scroll">
      <h1 class="page-title">特训与错题台</h1>
      <p class="subtitle">只练弱项、自由练习、查看与管理学习记录</p>
      <article class="card lab-card">
        <div class="row between"><h2 class="lab-title">智能弱项特训</h2><span class="pill" id="weakCount">0 题待巩固</span></div>
        <p class="hint">错题与反应缓慢题自动归档，连续快速答对两次可移出。</p>
        <button class="btn primary full" id="weakStart">智能弱项强化（10 题）</button>
        <button class="btn outline full" id="pairedStart" style="margin-top:10px">13/30～19/90 成对易混特训</button>
        <div class="weak-list" id="weakList"></div>
        <button class="btn danger full" id="clearWeak" style="margin-top:9px">清空特训池</button>
      </article>

function migrateLegacyCourseIds(raw){
  if(!raw||raw.courseRevision>=2)return raw;
  const mapId=id=>id==='num:15'?'num:17':id==='num:16'?'num:18':id;
  const fixQuestion=q=>{
    if(!q||q.kind!=='numeric')return q;
    if(Number(q.levelId)===15)q.levelId=17;
    else if(Number(q.levelId)===16)q.levelId=18;
    return q;
  };
  const levels={};
  for(const [id,value] of Object.entries(raw.levels||{}))levels[mapId(id)]=value;
  raw.levels=levels;
  const weak={};
  for(const entry of Object.values(raw.errorPool||{})){
    if(!entry||!entry.question)continue;
    fixQuestion(entry.question);
    const key=entry.question.kind==='word'?entry.key:
      'num:'+entry.question.levelId+':'+entry.question.answer;
    weak[key]={...entry,key};
  }
  raw.errorPool=weak;
  if(raw.activeSession){
    raw.activeSession.levelId=mapId(raw.activeSession.levelId);
    for(const q of raw.activeSession.queue||[])fixQuestion(q);
  }
  raw.courseRevision=2;
  return raw;
}
function normalizeStoredState(raw){

    levels,errorPool,activeSession};
}

function openStateDB(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB 不可用'));

    let request;

    catch(error){ reject(error); return; }
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains('appState')) db.createObjectStore('appState');
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('打开本机数据库失败'));
    request.onblocked=()=>reject(new Error('本机数据库被其他页面占用'));
  });

}
function writeStateDB(snapshot){
  return openStateDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction('appState','readwrite');
    tx.objectStore('appState').put(snapshot,'state');
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error||new Error('写入本机数据库失败'));
    tx.onabort=()=>reject(tx.error||new Error('本机数据库写入中断'));
  }));
}
function readStateDB(){
  return openStateDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction('appState','readonly');

    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error||new Error('读取本机数据库失败'));
  }));
}
function updateStorageStatus(){
  const el=$('storageStatus');
  if(!el)return;

function persist(){
  state.updatedAt=Date.now();

  try { window.localStorage.setItem(STORE_KEY,snapshot); localOk=true; storageSource='localStorage'; } catch(e) {}

    try { window.sessionStorage.setItem(STORE_KEY,snapshot); sessionOk=true; storageSource='sessionStorage 临时备用'; } catch(e) {}
  }

    dbWriteQueue=dbWriteQueue.then(()=>writeStateDB(snapshot)).then(()=>{
      if(!localOk) storageSource='IndexedDB 本机备用';

  }

}
async function restoreIndexedState(){

function roundGrade(accuracy,avg){
  const passed=accuracy>=90 && avg!==null && Number.isFinite(avg) && avg<1500;
  return {passed,stars:!passed?0:(accuracy>=95 && avg<1000?3:accuracy>=95?2:1)};
}
function gradeGap(accuracy,avg,validCount=0){
  const missingAccuracy=Math.max(0,90-accuracy);
  const milliseconds=avg===null?null:Math.max(0,Math.floor(avg)-1499);
  const parts=[];
  if(missingAccuracy)parts.push('正确率还差 '+missingAccuracy+' 个百分点');
  if(!validCount)parts.push('还没有有效反应时间记录');
  else if(milliseconds>0)parts.push('平均反应需再快 '+msText(milliseconds)+'（目标 <1.50s）');
  return parts.length?'距离通关：'+parts.join('；'):'已满足通关条件';
}
function clockBegin(s){if(s&&!document.hidden&&!s.activeStartedAt)s.activeStartedAt=Date.now();}
function clockPause(s){
  if(!s||!s.activeStartedAt)return;
  const start=s.activeStartedAt,end=Date.now(),duration=Math.max(0,Math.min(1800000,end-start));
  s.activeMs=(Number(s.activeMs)||0)+duration;
  if(duration){
    if(!state.dailyStats||typeof state.dailyStats!=='object')state.dailyStats={};
    const day=localDateKey(end),entry=state.dailyStats[day]||{durationMs:0};
    entry.durationMs=(Number(entry.durationMs)||0)+duration;
    state.dailyStats[day]=entry;

}
function localDateKey(ms){const d=new Date(ms);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function offsetDateKey(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return localDateKey(d.getTime());}
function summaryReviewItems(completed){
  const rows=Array.isArray(completed.answers)?completed.answers:[];

    Number(a.correct)-Number(b.correct) ||

const ones=['zero','one','two','three','four','five','six','seven','eight','nine'];
const teens=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function below1000(n, british=false){
  const parts=[];
  if(n>=100){parts.push(ones[Math.floor(n/100)]+' hundred');n%=100;if(n && british)parts.push('and');}
  if(n>=20){parts.push(tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:''));}
  else if(n>=10) parts.push(teens[n-10]);
  else if(n>0) parts.push(ones[n]);
  return parts.join(' ');
}
function numWords(n, british=false){
  n=Number(n); if(!Number.isSafeInteger(n)||n<0||n>9999999999) throw Error('数字越界');
  if(n===0) return 'zero';
  const groups=[[1000000000,'billion'],[1000000,'million'],[1000,'thousand'],[1,'']];
  const items=[];
  for(const [scale,label] of groups){
    const x=Math.floor(n/scale); if(x){items.push(below1000(x,british)+(label?' '+label:''));n%=scale;}
  }
  return items.join(' ');
}
function digitsWords(digits, allowGroups=false){
  const a=[];
  for(let i=0;i<digits.length;){
    const current=digits[i];let end=i+1;
    while(end<digits.length && digits[end]===current)end++;
    const count=end-i;
    if(allowGroups && count>=2){
      if(count===2) a.push('double '+(current==='0'?pick(['zero','oh']):ones[Number(current)]));
      else if(count===3) a.push('triple '+(current==='0'?pick(['zero','oh']):ones[Number(current)]));
      else for(let j=0;j<count;j++)a.push(current==='0'?pick(['zero','oh']):ones[Number(current)]);
    } else for(let j=i;j<end;j++)a.push(current==='0'?pick(['zero','oh']):ones[Number(current)]);
    i=end;
  }
  return a.join(' ');
}
function yearWords(y){
  if(y===2000) return 'two thousand';
  if(y>=2001 && y<=2009) return 'two thousand '+ones[y%100];
  const first=Math.floor(y/100),last=y%100;
  return numWords(first)+(last===0?' hundred':last<10?' oh '+ones[last]: ' '+numWords(last));
}
function hourWords(h){ return ones[h] || numWords(h); }
function timeWords(h,m,style){
  if(style==='natural'){
    if(m===0)return hourWords(h)+" o'clock";

    if(m===30)return 'half past '+hourWords(h);
    if(m===45)return 'quarter to '+hourWords(h%12+1);
    if(m<30)return numWords(m)+' past '+hourWords(h);
    return numWords(60-m)+' to '+hourWords(h%12+1);
  }
  return hourWords(h)+(m===0?" o'clock":m<10?' oh '+ones[m]:' '+numWords(m));
}

    case 11:{const h=rand(1,12),m=pick([0,5,10,15,20,25,30,35,40,45,50,55,rand(1,59)]);a=timeAnswer(h,m);text='The time is '+timeWords(h,m,rand(0,1)?'natural':'straight')+'.';return question(id,a,text,'按 HH:MM 输入，使用 12 小时制。');}

function stageCMinimalWeight(q){

function stageCQueue(levelId,count){
  let pool=levelId==='special:minimal'?STAGE_C.minimum:
    levelId==='special:scene'?STAGE_C.scenarios:null;
  if(!Array.isArray(pool)||!pool.length)throw Error('阶段 C 独立题库未加载，请将 stage-c-data.js 一并上传');
  const queue=[];
  if(levelId==='special:minimal'){
    const pairs=[...new Set(pool.map(x=>x.pairKey))];
    const round=shuffle(pairs);
    while(queue.length<count){
      const weighted=pairs.flatMap(key=>Array.from({length:stageCMinimalWeight(pool.find(x=>x.pairKey===key))},()=>key));
      const pair=round.length?round.shift():pick(weighted);
      const variants=pool.filter(x=>x.pairKey===pair);
      const last=queue.at(-1);
      const options=last?.minimalPair===pair?variants.filter(x=>x.answer!==last.answer):variants;
      queue.push(stageCQuestion(pick(options.length?options:variants),levelId));
    }
  }else{
    let deck=[];
    while(queue.length<count){
      if(!deck.length)deck=shuffle(pool);
      queue.push(stageCQuestion(deck.pop(),levelId));
    }
  }
  return queue;
}

  }

function allWords(){return examples;}
function wordGroups(){
  const groups=new Map();
  for(const w of allWords()){
    const key='word:'+w.category;
    if(!groups.has(key)) groups.set(key,{id:key,title:w.category,desc:'听发音，选出准确中文含义',kind:'word',number:({'电工与电气工程核心词':21,'自动化与智能控制核心词':22,'高频工程短句、词组与句型':23})[w.category],words:[]});
    groups.get(key).words.push(w);
  }
  return [...groups.values()];
}
function allLessons(){return numericLessons.map(x=>({...x,id:'num:'+x.id,kind:'numeric',number:x.id})).concat(wordGroups(),stageCSpecialLessons);}
function wordQuestion(word,group){
  const pool=allWords().filter(x=>x.id!==word.id && x.meaning!==word.meaning);
  let wrong=shuffle(pool).slice(0,3).map(x=>x.meaning);
  while(wrong.length<3)wrong.push(['以上都不是','其他意思','无法判断'][wrong.length]);
  const choices=shuffle([word.meaning,...wrong]);
  return {kind:'word',levelId:'word:'+word.category,wordId:word.id,answer:word.meaning,audioText:word.audioText,meaning:word.meaning,phonetic:word.phonetic,example:word.example,word:word.answer,subCategory:word.subCategory,choices};
}
function makeQuestion(levelId){
  if(levelId.startsWith('special:'))return stageCQueue(levelId,1)[0];
  if(levelId.startsWith('num:')) return generateNumber(Number(levelId.slice(4)),state.settings.locale);
  const group=wordGroups().find(g=>g.id===levelId);
  if(!group || !group.words.length) throw Error('词库为空');
  return wordQuestion(pick(group.words),group);
}
function assembleQueue(levelId,count){
  if(levelId.startsWith('special:'))return stageCQueue(levelId,count);
  // Short vocabulary sets cycle through separately shuffled decks, never leave a slot empty.
  if(levelId.startsWith('word:')){
    const group=wordGroups().find(g=>g.id===levelId);
    if(!group||!group.words.length)throw Error('词库为空');
    const queue=[];
    while(queue.length<count){
      for(const word of shuffle(group.words)){
        if(queue.length===count)break;
        queue.push(wordQuestion(word,group));
      }
    }
    return queue;
  }
  const q=[],used=new Set();
  for(let i=0;i<count;i++){
    let next=null;
    for(let retry=0;retry<20;retry++){
      const candidate=makeQuestion(levelId);next=candidate;
      const key=candidate.kind==='word'?candidate.wordId:candidate.answer;
      if(!used.has(key)){used.add(key);break;}
    }
    q.push(next);
  }
  return q;
}

function getConfusableTwin(target){
  const raw=String(target??'').trim();
  if(!raw)return null;
  const clock=raw.match(/^(\d{1,2}):(\d{2})$/);
  if(clock){
    const h=Number(clock[1]),m=Number(clock[2]);
    if(h===4&&m===15)return '3:45';
    if(h===3&&m===45)return '4:15';
    if(m===15)return String((h+10)%12+1)+':45';
    if(m===45)return String(h%12+1)+':15';
    return null;
  }
  if(/^\d+\.\d+$/.test(raw)){
    const n=Number(raw);
    if(!Number.isFinite(n))return null;
    const scaled=n<10?n*10:n/10;
    return String(Number(scaled.toFixed(5)));
  }
  if(!/^\d+$/.test(raw))return null;
  const n=Number(raw);
  const solo={0:8,8:0,5:9,9:5,2:3,3:2};
  if(n<10 && solo[n]!==undefined)return String(solo[n]);
  for(let d=3;d<=9;d++){
    const teen=10+d,ty=d*10;
    if(n===teen)return String(ty);
    if(n===ty)return String(teen);
  }
  // Correct the last teen/tens component, preserving the hundreds/thousands prefix.
  const mod=n%100;
  if(n>=100 && n<10000){
    if(mod>=13&&mod<=19)return String(n-mod+(mod-10)*10);
    if(mod>=30&&mod<=90&&mod%10===0)return String(n-mod+10+mod/10);
  }
  // Powers of ten: 1500 ↔ 15000; 24000 ↔ 240000.
  if(n>=1000&&Number.isSafeInteger(n*10)&&n*10<=9999999999){
    // Keep the exemplar pairs reversible: 1500↔15000; 24000↔240000.
    if(n>=10000&&n<20000&&n%10===0)return String(n/10);
    if(n>=100000&&n%10000===0)return String(n/10);
    return String(n*10);
  }
  return null;
}
function numberSpeechForTwin(answer){
  const text=String(answer);
  if(/^\d{1,2}:\d{2}$/.test(text)){
    const [h,m]=text.split(':').map(Number);
    return 'The time is '+timeWords(h,m,'straight')+'.';
  }
  if(/^\d+\.\d+$/.test(text)){
    const [whole,decimals]=text.split('.');
    return numWords(Number(whole))+' point '+[...decimals].map(c=>ones[Number(c)]).join(' ');
  }
  return numWords(Number(text));
}
function makeConfusableTwin(q){
  if(!q||q.kind!=='numeric')return null;
  const answer=getConfusableTwin(q.answer);
  if(!answer||answer===String(q.answer))return null;
  const clone={...q,answer,audioText:numberSpeechForTwin(answer),
    meaning:'易混镜像对照：'+q.answer+' ↔ '+answer+'。抓住重音、进位与数位的区别。',
    confusableBase:String(q.answer),confusableTwin:answer};
  if(q.stageC){
    clone.spellingTarget=numberSpeechForTwin(answer);
    clone.answerType=answer.includes(':')?'time':answer.includes('.')?'decimal':'number';
    clone.acceptedAnswers=[];clone.equivalentReadings=[];
    clone.stageCId=q.stageCId+'-twin-'+answer;
  }
  delete clone.displayAnswer;
  return clone;
}
function weakQuestionCopy(original){
  const q=JSON.parse(JSON.stringify(original));
  if(q.kind==='word'){
    const w=allWords().find(x=>x.id===q.wordId && 'word:'+x.category===q.levelId);
    if(w)Object.assign(q,wordQuestion(w,null));
    else {
      q.choices=shuffle([q.answer,...shuffle(allWords().filter(x=>x.meaning!==q.answer)).slice(0,3).map(x=>x.meaning)]);
      while(q.choices.length<4)q.choices.push('其他释义 '+q.choices.length);
    }
  }
  return q;
}
function assembleWeakQueue(count,fallback=[]){
  const entries=Object.values(state.errorPool).filter(x=>x&&x.question&&x.question.answer!=null);
  const weighted=entries.length
    ?entries.flatMap(e=>Array.from({length:clamp((e.errors||0)+(e.slow||0),1,5)},()=>e.question))
    :fallback.filter(q=>q&&q.answer!=null);
  if(!weighted.length)throw Error('暂无可用于弱项强化的题目');
  const queue=[];
  while(queue.length<count){
    const original=weakQuestionCopy(pick(weighted));
    const twin=makeConfusableTwin(original);
    const burst=twin?[original,twin,twin,original]:[original,original];
    for(const q of burst){if(queue.length<count)queue.push(weakQuestionCopy(q));}
  }
  return queue;
}
function startWeak(count=10){
  if(earState.active)stopEarMode();
  try{
    const queue=assembleWeakQueue(normalizedTrainingCount(count));
    stopSpeech();finishSpeechRecognition();
    session={mode:'weak',levelId:'weak',title:'成对易混镜像特训',queue,index:0,correct:0,
      sumMs:0,fastestMs:null,startedAt:null,isStarted:false,activeMs:0,activeStartedAt:null,answers:[],accentMode:'en-US',noiseMode:'clean'};
    state.activeSession=session;persist();beginQuestion();
  }catch(e){toast(e.message||'无法生成弱项练习');}
}

function resumeSession(){
  if(earState.active)stopEarMode();
  const item=state.activeSession;
  if(!item||!Array.isArray(item.queue)||!item.queue.length||item.index>=item.queue.length){toast('没有可恢复的练习');return;}
  session=item;
  // Answer submissions are already recorded; never let resuming submit them twice.
  if(session.awaitingNext&&session.lastFeedback){
    if(session.index>=session.queue.length-1){finishSession();return;}
    session.index++;session.awaitingNext=false;session.lastFeedback=null;
  }
  session.isStarted=false;session.activeStartedAt=null;
  // Legacy free-practice rounds of 50 cannot be represented in the 10/20/30 selector.
  if(!TRAINING_COUNTS.includes(session.queue.length)){
    changeTrainingQuestionCount(30);
    return;
  }
  state.activeSession=session;persist();
  beginQuestion();
}

function inputLooksComplete(q,typed){
  const v=String(typed||'').trim(),expected=String(q.answer||'');
  if(q.stageC)return false; // Explicit confirmation avoids prefix/leading-zero mistakes.
  if(!v)return false;
  if($('reflectionMode').value==='spell')return false; // Spelling is submitted ONLY via explicit confirmation.
  const level=effectiveLevel(q);
  if(level===11||(level===18&&expected.includes(':')))return /^\d{1,2}:\d{2}$/.test(v);
  if(level===13)return v.replace(/\D/g,'').length>=expected.replace(/\D/g,'').length;
  if(level===14)return v.replace(/[\s-]/g,'').length>=expected.replace(/[\s-]/g,'').length;
  if(expected.endsWith('%')&&!expected.includes('.'))return v.replace(/\D/g,'').length>=expected.replace(/\D/g,'').length;
  if(expected.includes('.')){
    const decimals=(expected.split('.')[1]||'').replace(/%/g,'').length;
    return /^\d+\.\d+$/.test(v.replace(/%/g,''))&&v.split('.')[1].replace(/%/g,'').length>=decimals;
  }

}

function normalizeAnswer(q,value){
  let s=String(value??'').trim();
  if(q.kind==='word')return s;
  if(effectiveLevel(q)===14){return s.toUpperCase().replace(/[\s-]/g,'');}
  if(effectiveLevel(q)===13)return s.replace(/\D/g,'');
  if(effectiveLevel(q)===11 || (effectiveLevel(q)===18 && String(q.answer).includes(':'))){
    const m=s.match(/^(\d{1,2}):(\d{1,2})$/);
    return m?String(Number(m[1])).padStart(2,'0')+':'+String(Number(m[2])).padStart(2,'0'):s;
  }
  s=s.replace(/,/g,'').replace(/\s+/g,'');
  if(/^\d+(\.\d+)?%?$/.test(s)){
    if(String(q.answer).endsWith('%')&&!s.endsWith('%'))s+='%';

    if(!base.includes('.'))s=String(Number(base))+(hasPercent?'%':'');

  $('listenCard').innerHTML=`<div class="feedback-card"><div class="feedback-verdict ${correct?'good':'bad'}">${correct?'✓':'✕'} ${verdict}</div><div class="feedback-sub">反应耗时 <strong>${timerLabel}</strong> · ${speed}</div><div class="feedback-line"><span class="k">${spelling?'标准英文拼写':'标准答案'}</span><span class="v">${esc(answerShown)}</span></div>${spelling&&q.kind==='numeric'?'<div class="feedback-line"><span class="k">对应数字</span>'+esc(q.answer)+'</div>':''}<div class="feedback-line"><span class="k">英文读法 / 播报原句</span><span class="v" style="font-size:13px;font-weight:600">${esc(reading)}</span></div><div class="feedback-line"><span class="k">音标拆解（已内置音标为主）</span><span class="ipa">${esc(ipa)}</span></div><div class="feedback-line"><span class="k">我的输入</span><span class="v">${highlightDiff(String(answerShown),String(given))}</span></div>${comparison}${pairEncourage}${accentReveal}${environmentReveal}${optional}${q.feedbackHint?'<div class="stagec-tip">'+esc(q.feedbackHint)+'</div>':''}${q.stageC?'<div class="feedback-line"><span class="k">中文解析</span>'+esc(q.meaning)+(q.acceptedAnswers?.length?' · 允许：'+esc(q.acceptedAnswers.join(' / ')):'')+(q.equivalentReadings?.length?' · 等价读法：'+esc(q.equivalentReadings.join(' / ')):'')+'</div>':''}</div>`;
  $('answerDisplay').classList.add('hidden');

function nextQuestion(){
  clearFlowTimer();clearAutoSubmitTimer();stopSpeech();
  if($('reflectionMode').value!=='speak')finishSpeechRecognition();stopNoise();
  if(!session)return;
  if(session.index===session.queue.length-1){finishSession();return;}
  session.index++;session.awaitingNext=false;session.lastFeedback=null;state.activeSession=session;persist();beginQuestion();

function finishSession(){
  if(!session)return;
  stopSpeech();clearFlowTimer();finishSpeechRecognition();clockPause(session);
  const completed=session;
  const accuracy=Math.round(completed.correct/completed.queue.length*100);
  const validCount=Number.isFinite(completed.validLatencyCount)?completed.validLatencyCount:
    (Number(completed.sumMs)>0?completed.queue.length:0);
  const avg=validCount?completed.sumMs/validCount:null;
  const {passed,stars}=roundGrade(accuracy,avg);
  const at=Date.now();
  if(completed.mode==='lesson'){
    const current=state.levels[completed.levelId]||{attempts:0,stars:0,passed:false};
    current.attempts=(current.attempts||0)+1;
    // Previous versions used a looser threshold. Recalculate historic qualification
    // from available best/last round metrics; unknown legacy passes must not stay green.
    current.passed=Boolean(current.passed||passed);
    current.stars=Math.max(current.stars||0,stars);
    current.last={accuracy,avgMs:avg,stars,at};
    current.gradeEvidence=[...(current.gradeEvidence||[]),{accuracy,avgMs:avg,stars,at}].slice(-10);
    if(!current.best || accuracy>current.best.accuracy ||
       (accuracy===current.best.accuracy&&(avg??Infinity)<(current.best.avgMs??Infinity))){
      current.best={accuracy,avgMs:avg,stars,at};
    }
    if(completed.fastestMs!==null)current.fastestMs=current.fastestMs==null?completed.fastestMs:Math.min(current.fastestMs,completed.fastestMs);
    state.levels[completed.levelId]=current;
  }
  if(!Array.isArray(state.trainingHistory))state.trainingHistory=[];
  state.trainingHistory.push({at,date:localDateKey(at),levelId:completed.levelId,mode:completed.mode,
    questionCount:completed.queue.length,correct:completed.correct,accuracy,avgMs:avg,validCount,
    durationMs:Math.round(completed.activeMs||0),stars,passed});
  state.trainingHistory=state.trainingHistory.slice(-300);
  state.activeSession=null;persist();session=null;
  const gaps=gradeGap(accuracy,avg,validCount);
  const review=summaryReviewItems(completed);
  const reviewMarkup=review.map((item,i)=>`<div class="review-item"><div class="review-detail"><strong>${i+1}. ${esc(item.answer)} · ${item.elapsed===null?'未计时':msText(item.elapsed)}${item.correct?' · 卡壳':' · 答错'}</strong><small>${esc(item.english)}${item.correct?'':' · 你的答案：'+esc(item.given)}</small></div><button class="btn ghost" data-review-index="${i}">🔊 重听</button></div>`).join('');
  $('summaryPanel').innerHTML=`<div class="summary-title">${passed||completed.mode!=='lesson'?'练习完成':'本关尚未通关'}</div>
    <div class="summary-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="micro">${completed.mode==='lesson'?(passed?'本次已达通关标准':'正确率 ≥90% 且平均反应 &lt;1.5s 才能通关'):'自由/弱项训练不改变关卡通关记录；以下为本次表现'}</div>
    <div class="summary-grid"><div><strong>${accuracy}%</strong><span>准确率</span></div>
    <div><strong>${avg===null?'—':msText(avg)}</strong><span>平均反应时间</span></div>
    <div><strong>${completed.correct}/${completed.queue.length}</strong><span>答对题数</span></div></div>
    <div class="micro" style="margin-bottom:8px">有效计时 ${validCount}/${completed.queue.length} 题 · 提前作答 ${completed.earlyCount||0} 题 · 重听 ${completed.replayedQuestions||0} 题</div>
    <div class="pass-gap ${passed?'passed':''}">${esc(gaps)}</div>
    <div class="reaction-benchmark">反应时间目标：&lt;1s 优秀 · 1–1.5s 良好 · &gt;1.5s 需加强</div>
    <p class="hint" style="text-align:left">1 星：正确率 ≥90% 且均速 &lt;1.5s；2 星：正确率 ≥95% 且均速 &lt;1.5s；3 星：正确率 ≥95% 且均速 &lt;1s。未计时的题不计入均速。</p>
    <div class="review-title">⏱️ 本轮最慢 / 错题 Top 3 复盘</div>
    ${reviewMarkup||'<div class="micro">本轮没有逐题复盘数据。</div>'}
    <button class="btn ghost full" id="reviewPlayAll" style="margin-top:8px" ${review.length?'':'disabled'}>🔊 连播复盘这 ${review.length} 题</button>
    <div class="summary-actions"><button class="btn outline" id="summaryHome">返回课程</button><button class="btn primary" id="summaryAgain">再练一次</button></div>`;
  $('summaryMask').classList.add('visible');
  function stopReview(){runtime.reviewPlaybackToken++;try{window.speechSynthesis?.cancel();}catch(e){}}
  function playReview(index,token){
    if(token!==runtime.reviewPlaybackToken||!$('summaryMask').classList.contains('visible')||index>=review.length)return;
    const item=review[index];
    speakPlain(item.english,()=>{
      if(token!==runtime.reviewPlaybackToken)return;
      if(index+1<review.length)playReview(index+1,token);
    },item.accent);
  }
  $('summaryPanel').querySelectorAll('[data-review-index]').forEach(btn=>btn.onclick=()=>{
    stopReview();const item=review[Number(btn.dataset.reviewIndex)];
    if(item)speakPlain(item.english,null,item.accent);
  });
  $('reviewPlayAll').onclick=()=>{stopReview();playReview(0,runtime.reviewPlaybackToken);};
  $('summaryHome').onclick=()=>{stopReview();$('summaryMask').classList.remove('visible');refresh();showPage('home');};
  $('summaryAgain').onclick=()=>{stopReview();$('summaryMask').classList.remove('visible');if(completed.mode==='weak')startWeak(completed.queue.length);else startSession(completed.levelId,completed.mode,completed.queue.length);};
}
function leavePractice(){
  if(earState.active)stopEarMode();

  stopSpeech();clearFlowTimer();clearAutoSubmitTimer();finishSpeechRecognition();session=null;refresh();showPage('home');

function renderGroup(title,items){
  return `<div class="section-title">${esc(title)}<small>${items.length} 关</small></div><div class="lesson-group">${items.map((l,i)=>{
    const record=state.levels[l.id]||{},passed=record.passed;
    const active=state.activeSession?.levelId===l.id;
    const stateClass=passed?'passed':active||record.attempts?'started':'';
    const status=passed?'<span class="status passed">'+('★'.repeat(record.stars||1))+'</span>':active?'<span class="status going">进行中</span>':record.attempts?'<span class="status going">待通关</span>':'<span class="status">未开始</span>';
    const best=record.best?`历史: ${record.best.avgMs==null?'未计时':msText(record.best.avgMs)} | 正确率 ${record.best.accuracy}%`:'尚无历史成绩';
    const candidate=[...(record.gradeEvidence||[]),record.best,record.last].filter(Boolean)
      .map(v=>({accuracy:Number(v.accuracy)||0,avg:Number.isFinite(v.avgMs)?v.avgMs:null}));
    candidate.sort((a,b)=>Number(roundGrade(b.accuracy,b.avg).passed)-Number(roundGrade(a.accuracy,a.avg).passed)||
      Math.max(0,90-a.accuracy)-Math.max(0,90-b.accuracy)|| (a.avg??Infinity)-(b.avg??Infinity));
    const gap=passed?'已通关 · '+record.stars+' 星':record.attempts&&candidate.length?gradeGap(candidate[0].accuracy,candidate[0].avg,candidate[0].avg!=null?1:0):'目标：正确率 ≥90% · 均速 <1.5s';
    const index=String(l.number).padStart(2,'0');
    return `<button class="lesson ${stateClass}" data-lesson="${esc(l.id)}"><div class="lesson-index">${index}</div><div class="lesson-main"><div class="lesson-name">${esc(l.title)}</div><div class="lesson-desc">${esc(l.kind==='word'?l.desc+' · '+l.words.length+' 词':l.desc)}</div><div class="lesson-score">${esc(best)}${record.fastestMs!=null?' · 极速 '+Math.round(record.fastestMs)+'ms':''}</div><div class="lesson-score" style="color:${passed?'#078D49':'#BA7850'}">${esc(gap)}</div></div>${status}</button>`;
  }).join('')}</div>`;
}

async function importProgressFile(file){
  if(!file)return;
  try{
    if(file.size>5*1024*1024)throw Error('备份文件超过 5MB，已拒绝导入');
    const content=typeof file.text==='function'?await file.text():await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('读取文件失败'));reader.readAsText(file);});
    const data=JSON.parse(content),incoming=data?.format==='voice-reflex-backup'?data.state:data;
    if(!incoming||incoming.version!==1||typeof incoming.levels!=='object'||!incoming.levels||typeof incoming.errorPool!=='object'||!incoming.errorPool)throw Error('文件不是可识别的学习进度 JSON');
    if(!confirm('导入将用备份中的进度、设置、统计及错题替换当前数据。继续？'))return;
    // Strict whitelist after parsing: retain compatibility with the original v1 progress schema.
    const valid=normalizeStoredState(incoming);
    const old=state;
    state=valid;state.updatedAt=Date.now();
    try{if(!persist())throw Error('无法写入本机存储');}catch(e){state=old;throw e;}
    stopSpeech();finishSpeechRecognition();session=null;
    if($('summaryMask'))$('summaryMask').classList.remove('visible');
    refresh();showPage('lab');toast('进度导入成功');
  }catch(e){toast('导入失败：'+(e.message||'文件格式错误'));}
}

  window.addEventListener('blur',()=>{if(earState.active)earPause('系统中断或来电，播放已暂停');});
  window.addEventListener('focus',()=>{if(earState.active)resumeEarMode();});

}
function installManifest(){
  if(location.protocol==='http:'||location.protocol==='https:')return;
  
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="44" fill="#07C160"/><path d="M46 98h20m12-28v56m16-79v102m16-65v28m16-42v56m16-28h12" stroke="white" stroke-width="12" stroke-linecap="round"/></svg>';
  const icon='data:image/svg+xml,'+encodeURIComponent(svg);
  const manifest={name:'英语数字与专业词汇声音反射训练',short_name:'声音反射训练',start_url:'./index.html',display:'standalone',background_color:'#F7F8FA',theme_color:'#07C160',icons:[{src:icon,sizes:'192x192',type:'image/svg+xml',purpose:'any maskable'}]};
  const link=document.createElement('link');link.rel='manifest';link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));document.head.appendChild(link);
}
function syncAppViewport(){
  const height=window.visualViewport&&window.visualViewport.height?window.visualViewport.height:window.innerHeight;
  document.documentElement.style.setProperty('--app-height',Math.max(320,Math.round(height))+'px');
}
function boot(){
  syncAppViewport();
  window.addEventListener('resize',syncAppViewport,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(syncAppViewport,180),{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',syncAppViewport,{passive:true});
  installManifest();setupEvents();refresh();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
  if('speechSynthesis' in window){
    try{
      const engine=window.speechSynthesis;
      engine.getVoices();
      const voiceReady=()=>{
        if(!earState.active&&session&&session.isStarted&&!runtime.feedback&&runtime.readyAt===null&&!runtime.speaking&&
          $('practicePage').classList.contains('active')&&$('reflectionMode').value!=='speak'&&
          voiceForAccent(questionAccent()))speakCurrent();
      };
      if(engine.addEventListener)engine.addEventListener('voiceschanged',()=>{preferredUSVoice();voiceReady();});
      else engine.onvoiceschanged=()=>{preferredUSVoice();voiceReady();};
    }catch(e){}
  }
  restoreIndexedState();
  if(!('speechSynthesis' in window))toast('当前环境不支持原生 TTS；其他功能可继续使用。');
}
boot();
</script>
